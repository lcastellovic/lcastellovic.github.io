<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Interés Compuesto</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding-top: 72px;
        }

        .back-link {
            left: 20px;
            text-decoration: none;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-muted);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        button.btn-calc {
            width: 100%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button.btn-calc:hover {
            background-color: var(--btn-hover);
        }

        .results {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--input-bg);
            border-radius: 10px;
            border-left: 4px solid var(--accent-green);
        }

        .results p {
            margin: 8px 0;
            font-size: 16px;
        }

        .highlight {
            font-weight: 700;
            font-size: 20px;
            color: var(--accent-green);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            font-size: 14px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--table-header);
            color: var(--text-muted);
            font-weight: 600;
        }

        td {
            color: var(--text-main);
        }

        .table-wrap {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 640px) {
            .container {
                padding-top: 68px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <a class="back-link" href="index.html">← Volver al menú</a>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ Modo Claro</button>
        <h2>Calculadora de Interés</h2>

        <div class="input-group">
            <label for="capital">Capital Inicial (€):</label>
            <input type="number" id="capital" value="10000" step="100">
        </div>

        <div class="input-group">
            <label for="interes">Interés Neto Anual (TAE %):</label>
            <input type="number" id="interes" value="2.0" step="0.01">
        </div>

        <div class="input-group">
            <label for="meses">Plazo (Meses):</label>
            <input type="number" id="meses" value="12" min="1">
        </div>

        <div class="input-group">
            <label for="impuestos">Retención fiscal (19% IRPF):</label>
            <select id="impuestos">
                <option value="si">Aplicar retención (Neto limpio)</option>
                <option value="no">Sin retención (Bruto)</option>
            </select>
        </div>

        <button class="btn-calc" onclick="calcularInteres()">Calcular Beneficios</button>

        <div class="results" id="resultado-resumen" style="display:none;">
            <p>Capital Final: <span id="res-final" class="highlight">0.00 €</span></p>
            <p>Total Intereses Ganados: <span id="res-beneficios" style="font-weight:600;">0.00 €</span></p>
        </div>

        <div class="table-wrap">
            <table id="tabla-meses" style="display:none;">
                <thead>
                    <tr>
                        <th>Mes</th>
                        <th>Saldo Inicial</th>
                        <th>Interés Ganado</th>
                        <th>Saldo Final</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Función para cambiar entre modo oscuro y claro
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            body.classList.toggle('light-mode');

            if (body.classList.contains('light-mode')) {
                btn.innerText = "🌙 Modo Oscuro";
            } else {
                btn.innerText = "☀️ Modo Claro";
            }
        }

        // Lógica de cálculo financiero
        function calcularInteres() {
            let capitalInicial = parseFloat(document.getElementById('capital').value);
            let tae = parseFloat(document.getElementById('interes').value) / 100;
            let meses = parseInt(document.getElementById('meses').value);
            let aplicarImpuestos = document.getElementById('impuestos').value === 'si';

            if (isNaN(capitalInicial) || isNaN(tae) || isNaN(meses) || meses <= 0) {
                alert("Por favor, introduce valores válidos.");
                return;
            }

            // Interés mensual compuesto equivalente
            let tasaMensual = Math.pow(1 + tae, 1 / 12) - 1;
            let saldoActual = capitalInicial;
            let totalInteresGanado = 0;

            let cuerpoTabla = document.getElementById('tabla-cuerpo');
            cuerpoTabla.innerHTML = "";

            for (let i = 1; i <= meses; i++) {
                let saldoInicialMes = saldoActual;
                let interesMesBruto = saldoInicialMes * tasaMensual;
                let interesMesEfectivo = aplicarImpuestos ? interesMesBruto * 0.81 : interesMesBruto;

                saldoActual += interesMesEfectivo;
                totalInteresGanado += interesMesEfectivo;

                let fila = `<tr>
            <td>Mes ${i}</td>
            <td>${saldoInicialMes.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €</td>
            <td style="color: var(--accent-green)">+${interesMesEfectivo.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €</td>
            <td><strong>${saldoActual.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €</strong></td>
        </tr>`;
                cuerpoTabla.innerHTML += fila;
            }

            // Actualizar textos finales formateados con separadores de miles estilo ES
            document.getElementById('res-final').innerText = saldoActual.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
            document.getElementById('res-beneficios').innerText = totalInteresGanado.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";

            document.getElementById('resultado-resumen').style.display = "block";
            document.getElementById('tabla-meses').style.display = "table";
        }
    </script>

</body>

</html>
